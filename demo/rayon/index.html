<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>js-workers-mpsc rayon demo</title>
  </head>
  <body>
    <!--
      NOTE: must be served with COOP/COEP headers — the rayon pool uses
      SharedArrayBuffer. e.g.

        npx serve --cors -H  # won't set COOP/COEP; use instead:
        python3 serve_coop_coep.py  (see repo README)
    -->
    <script type="module">
      import { BridgeWorker } from "./js/main.js";

      const worker = new BridgeWorker();

      // 1) Callback style: per-item handler + completion Promise.
      //    Results arrive in pool completion order, not index order.
      worker
        .call(20, (item) => console.log("callback style:", item))
        .then(() => console.log("callback style: done"));

      // 2) Async-iterator style. Runs concurrently with (1) on the same
      //    worker; per-stream `id`s keep the results separate.
      (async () => {
        for await (const item of worker.stream(30)) {
          console.log("async style:", item);
        }
        console.log("async style: done");
      })();
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>js-workers-mpsc rayon demo</title>
  </head>
  <body>
    <!--
      NOTE: must be served with COOP/COEP headers — the rayon pool uses
      SharedArrayBuffer. `just serve` (or `python3 serve.py`) sets them.
    -->
    <script type="module">
      import { BridgeWorker } from "../../crates/core/js/main.js";

      const worker = new BridgeWorker({
        wasmUrl: new URL("./pkg/js_workers_mpsc_example_rayon.js", import.meta.url)
          .href,
        taskName: "runParallelTask",
        initThreadPool: true,
      });

      // 1) Event style: items flow to `onmessage`, one per channel send.
      //    Results arrive in pool completion order, not index order.
      worker.onmessage = (item) => console.log("event style:", item);
      worker.onerror = (err) => console.error("event style:", err);
      await worker.send(20);

      // 2) Callback style: per-item handler + completion Promise.
      await worker.call(20, (item) => console.log("callback style:", item));

      // 3) Async-iterator style. Runs after (1) and (2); per-stream `id`s
      //    keep the results separate.
      for await (const item of worker.stream(20)) {
        console.log("async style:", item);
      }
      console.log("all done");
    </script>
  </body>
</html>
